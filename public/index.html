<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🔐 Iniciar sesión | Consultorio Dental</title>
  <link rel="stylesheet" href="css/login.css" />

  <!-- ✅ DEFER (como ocupamos) -->
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11" defer></script>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
</head>
<body>
  <div class="login-container">
    <div class="logo">
      <i class="fas fa-tooth" style="font-size: 2.5rem; color: #1e88e5;"></i>
    </div>
    <h1>🦷 Consultorio Dental</h1>
    <p class="instructions">Ingresa tus credenciales institucionales para acceder al sistema de gestión clínica.</p>

    <form id="login-form" novalidate>
      <div class="input-group">
        <label for="email">Correo electrónico</label>
        <div class="input-icon">
          <i class="fas fa-envelope"></i>
          <input type="email" id="email" placeholder="ejemplo@consultorio.com" required />
        </div>
      </div>

      <div class="input-group">
        <label for="password">Contraseña</label>
        <div class="input-icon">
          <i class="fas fa-lock"></i>
          <input type="password" id="password" placeholder="••••••••" required />
        </div>
      </div>

      <button type="submit" id="login-btn">
        <i class="fas fa-sign-in-alt"></i> Ingresar
      </button>

      <p id="error-msg" class="error"></p>

      <div class="help-text">
        <small>¿Olvidaste tu contraseña? Contacta al administrador del sistema.</small>
      </div>
    </form>
  </div>

  <!-- ✅ DEFER también -->
  <script src="js/login.js" defer></script>
</body>
</html>
