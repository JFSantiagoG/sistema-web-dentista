<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>👤 Pacientes - Consultorio Dental</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <!-- Íconos -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <!-- Estilos -->
  <link rel="stylesheet" href="css/pacientes.css" />
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <!-- Auth guard -->
  <script src="js/auth-guard.js" defer></script>
</head>

<body class="bg-light">
  <div class="container py-5">

    <!-- HEADER -->
    <div class="d-flex flex-column flex-md-row justify-content-between align-items-start align-items-md-center mb-4 gap-3">
      <div>
        <h1 class="h2 fw-bold text-success mb-1">👤 Gestión de Pacientes</h1>
        <p class="text-muted mb-0">Busca, registra o administra pacientes.</p>
      </div>

      <div class="d-flex gap-2">
        <button class="btn btn-success" onclick="location.href='nuevo.html'">
          <i class="fas fa-user-plus me-1"></i> Nuevo paciente
        </button>
        <button class="btn btn-outline-secondary" onclick="location.href='menu.html'">
          <i class="fas fa-arrow-left me-1"></i> Volver
        </button>
      </div>
    </div>

    <!-- BUSCADOR -->
    <div class="card shadow-sm mb-4">
      <div class="card-body">
        <div class="row g-2">
          <div class="col-md-8">
            <input
              type="text"
              id="busqueda"
              class="form-control form-control-lg"
              placeholder="Buscar por nombre, teléfono o email"
            />
          </div>
          <div class="col-md-4">
            <button class="btn btn-primary w-100 btn-lg" onclick="buscarPacientes()">
              <i class="fas fa-search me-2"></i> Buscar
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- RESULTADOS -->
    <div class="card shadow-sm">
      <div class="card-body">
        <div id="resultados" class="text-center text-muted py-5">
          <i class="fas fa-users fa-2x mb-2"></i>
          <p>Ingresa un término de búsqueda</p>
        </div>
      </div>
    </div>

  </div>

  <footer class="text-center text-muted py-3 small">
    © <span id="anio"></span> SmileWorks
  </footer>

  <script>
    document.getElementById('anio').textContent = new Date().getFullYear();
  </script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/ui-notify.js"></script>
<script src="js/pacientes.js"></script>

</body>
</html>
