<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🦷 Consultorio Dental</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="css/main.css" />
  <script src="js/auth-guard.js"></script>
  <script src="js/logout.js"></script>
</head>
<body class="bg-light">
  <div class="container py-5">
    <!-- Encabezado -->
    <div class="text-center mb-5">
      <h1 class="display-4">🦷 Consultorio Dental</h1>
      <p class="lead">Sistema de gestión clínica dental</p>
      <button id="btnLogout" class="btn btn-outline-danger btn-sm">
        Cerrar sesión
      </button>
    </div>

    <!-- Menú principal: Agenda y Pacientes en fila -->
    <div class="row g-4 mb-5 justify-content-center">
      <div class="col-12 col-md-6">
        <a href="agenda.html" class="card main-card text-decoration-none text-dark shadow-sm border-primary">
          <div class="card-body">
            <h2 class="card-title mb-2">📅 Agenda</h2>
            <p class="card-text text-muted">Gestión de citas y calendario</p>
          </div>
        </a>
      </div>
      <div class="col-12 col-md-6">
        <a href="pacientes.html" class="card main-card text-decoration-none text-dark shadow-sm border-success">
          <div class="card-body">
            <h2 class="card-title mb-2">👤 Pacientes</h2>
            <p class="card-text text-muted">Búsqueda y ficha de pacientes</p>
          </div>
        </a>
      </div>
    </div>

    <!-- Visualizador centrado, con mismo formato que las anteriores -->
    <div class="row g-4 mb-5 justify-content-center">
      <div class="col-12 col-md-6">
        <a href="/visualizador" class="card main-card text-decoration-none text-dark shadow-sm border-info">
          <div class="card-body">
            <h2 class="card-title mb-2">🖼️ Visualizador</h2>
            <p class="card-text text-muted">Radiografías y tomografías sin registro</p>
          </div>
        </a>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
